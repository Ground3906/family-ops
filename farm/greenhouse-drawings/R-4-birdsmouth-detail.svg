<text x="48.00" y="1083.00" font-family="Arial" font-size="9.5" font-weight="bold" fill="#000" text-anchor="start">GENERAL NOTES</text>
<text x="50.00" y="1095.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">1. SOUTH BEARING ONLY. NORTH BEARING IS A RAKED</text>
<text x="50.00" y="1106.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">   CAP PLATE, FULL WIDTH, NO NOTCH - SEE N-1.</text>
<text x="50.00" y="1117.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">2. BEAM SOUTH FACE IS THE WALL FRAMING PLANE.</text>
<text x="50.00" y="1129.20" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">3. POSTS AND BEAM FULLY CLAD - NO EXPOSED TIMBER</text>
<text x="50.00" y="1140.60" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">   ON THE SOUTH FACE.</text>
<text x="50.00" y="1152.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">4. NO HEADER AT THE SOUTH WINDOWS - THE WALL IS</text>
<text x="50.00" y="1163.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">   NON-BEARING INFILL BETWEEN POSTS.</text>
<text x="50.00" y="1174.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">5. WINDOW FLANGE LANDS ON THE BEAM UNDERSIDE.</text>
<text x="50.00" y="1186.20" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">   HEAD CASING SCRIBES TO ROUGH-SAWN TIMBER.</text>
<text x="50.00" y="1197.60" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">6. NO ENGINEERED LUMBER ANYWHERE ON THIS BUILDING.</text>
<text x="50.00" y="1209.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">7. UPLIFT CONNECTION NOT SHOWN - NOT YET DETAILED.</text>
<text x="50.00" y="1220.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">8. SEE R-3 FOR RAFTER LAYOUT.</text>
<rect x="380.00" y="1068.00" width="320.00" height="205.00" fill="none" stroke="#000" stroke-width="0.8"/>
