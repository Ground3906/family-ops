<text x="720.00" y="1106.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">BEAM:  6x10 ROUGH-SAWN DOUG FIR OR LARCH</text>
<text x="720.00" y="1117.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">POST:  6x6 ROUGH-SAWN, GALV. STANDOFF BASE</text>
