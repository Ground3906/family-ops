<text x="390.00" y="1095.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">BIRDSMOUTH WEDGE:</text>
<text x="390.00" y="1106.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">  SEAT RUN:  6" - BEAM FULL WIDTH</text>
<text x="390.00" y="1117.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">NOTCH AT SOUTH FACE:  2 1/4" PLUMB</text>
<text x="390.00" y="1129.20" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">                      2 1/8" PERPENDICULAR</text>
<text x="390.00" y="1140.60" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">NOTCH AT NORTH END OF SEAT:  ZERO</text>
<text x="390.00" y="1152.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">  HYPOTENUSE ON STOCK EDGE:  6 13/32"</text>
<text x="390.00" y="1163.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">PLUMB-CUT WEDGE:</text>
<text x="390.00" y="1174.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">  ALONG TOP EDGE:  4 7/32"</text>
<text x="390.00" y="1186.20" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">  SQUARE STOCK END:  11 1/4"</text>
<text x="390.00" y="1197.60" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">  PLUMB CUT:  12"</text>
<text x="390.00" y="1209.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">RAFTER ABOVE SEAT:  9 3/4" PLUMB</text>
<text x="390.00" y="1220.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">                    9 1/8" PERPENDICULAR</text>
<text x="390.00" y="1231.80" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">FULL RAFTER DEPTH:  12" PLUMB</text>
<text x="390.00" y="1243.20" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">                    11 1/4" ACTUAL</text>
<text x="390.00" y="1254.60" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">PLUMB CUT:  FLUSH AT BEAM SOUTH FACE</text>
<text x="390.00" y="1266.00" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">PITCH:  4.5:12  (20.556 DEG)</text>
<text x="390.00" y="1277.40" font-family="Arial" font-size="8.0" fill="#000" text-anchor="start">BOTH RAFTER END CUTS ARE PARALLEL.</text>
