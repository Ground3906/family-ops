<text x="52.00" y="1187.00" font-family="Arial" font-size="12.5" font-weight="bold" fill="#000" text-anchor="start">GENERAL NOTES</text>
<text x="52.00" y="1207.00" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">1. LAYERS DRAWN EXPLODED FOR CLARITY. AS BUILT THEY STACK TIGHT.</text>
<text x="52.00" y="1221.60" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">2. SECTION THROUGH A 6x6 POST. INFILL BETWEEN POSTS IS NON-BEARING, NO HEADER.</text>
<text x="52.00" y="1236.20" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">3. BEAM SOUTH FACE IS THE FRAMING PLANE. POSTS AND BEAM FULLY CLAD.</text>
<text x="52.00" y="1250.80" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">4. PHASE 1 IS METAL. NO ROOF SHEATHING SOUTH OF THE 9'-7 1/4" LINE. SEE S-5.</text>
<text x="52.00" y="1265.40" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">5. NO ENGINEERED LUMBER.</text>
<text x="52.00" y="1280.00" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">6. VENTING NOT SHOWN. SOUTH VENT PANELS ARE BUILT AS THE NORTH ONES - PANEL CUT 1" LARGER THAN</text>
<text x="52.00" y="1294.60" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">   THE R.O., RIBS MATCHED TO THE WALL. SEE V-1.</text>
