<text x="732.00" y="1207.00" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">1. WALL SHEATHING, UP OVER THE BEAM AND RAFTER END.</text>
<text x="732.00" y="1221.60" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">2. WALL PRO-PANEL, HORIZONTAL. TOP COURSE RIPPED FLAT.</text>
<text x="732.00" y="1236.20" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">3. DRIP EDGE OVER THE FLAT COURSE.</text>
<text x="732.00" y="1250.80" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">4. ROOF PANEL OVER THE DRIP EDGE TOP LEG.</text>
<text x="732.00" y="1265.40" font-family="Arial" font-size="11.2" fill="#000" text-anchor="start">5. WATER SHEDS OFF THE ROOF, BREAKS AT THE HEM, FALLS PAST THE WALL. NOTHING RUNS BEHIND.</text>
