<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="1100" height="880" font-family="Arial">
  <rect width="1100" height="880" fill="#ffffff"/>

  <text x="60" y="88" font-size="12" fill="#777" font-style="italic">Not to scale.</text>
  <line x1="60" y1="102" x2="1040" y2="102" stroke="#1a1a1a" stroke-width="2"/>

  <!-- North arrow -->
  <g transform="translate(90,140)">
    <polygon points="0,-20 8,6 0,-1 -8,6" fill="#333"/>
    <text x="0" y="24" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">N</text>
  </g>

  <!-- ROOF / PANEL AREA -->
  <rect x="150" y="200" width="800" height="167.1" fill="#2b6cb0" opacity="0.55"/>
  <rect x="150" y="367.1" width="800" height="232.5" fill="#1e4d7b" opacity="0.55"/>
  <rect x="150" y="200" width="800" height="399.6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- RAFTER LINES - dashed, pulled from the west (bearing) side at 24" o.c.,
       east rafter set inboard of the east wall inner face -->
  <g stroke="#000000" stroke-width="1.1" stroke-dasharray="4 4" opacity="1">
    <line x1="150.0" y1="200" x2="150.0" y2="599.6"/>
    <line x1="190.0" y1="200" x2="190.0" y2="599.6"/>
    <line x1="230.0" y1="200" x2="230.0" y2="599.6"/>
    <line x1="270.0" y1="200" x2="270.0" y2="599.6"/>
    <line x1="310.0" y1="200" x2="310.0" y2="599.6"/>
    <line x1="350.0" y1="200" x2="350.0" y2="599.6"/>
    <line x1="390.0" y1="200" x2="390.0" y2="599.6"/>
    <line x1="430.0" y1="200" x2="430.0" y2="599.6"/>
    <line x1="470.0" y1="200" x2="470.0" y2="599.6"/>
    <line x1="510.0" y1="200" x2="510.0" y2="599.6"/>
    <line x1="550.0" y1="200" x2="550.0" y2="599.6"/>
    <line x1="590.0" y1="200" x2="590.0" y2="599.6"/>
    <line x1="630.0" y1="200" x2="630.0" y2="599.6"/>
    <line x1="670.0" y1="200" x2="670.0" y2="599.6"/>
    <line x1="710.0" y1="200" x2="710.0" y2="599.6"/>
    <line x1="750.0" y1="200" x2="750.0" y2="599.6"/>
    <line x1="790.0" y1="200" x2="790.0" y2="599.6"/>
    <line x1="830.0" y1="200" x2="830.0" y2="599.6"/>
    <line x1="870.0" y1="200" x2="870.0" y2="599.6"/>
    <line x1="910.0" y1="200" x2="910.0" y2="599.6"/>
    <line x1="938.3" y1="200" x2="938.3" y2="599.6"/>
  </g>
  <text x="545" y="628" font-size="11" fill="#333" text-anchor="middle">rafters (dashed), 24" o.c., pulled from the west &#8212; 21 total, last bay 1'-5"</text>

  <!-- East inboard callout -->
  <text x="1035" y="150" font-size="11" fill="#333" text-anchor="end">east wall non-bearing &#8212;</text>
  <text x="1035" y="165" font-size="11" fill="#333" text-anchor="end">east rafter set inboard of the wall</text>
  <text x="1035" y="180" font-size="11" fill="#333" text-anchor="end">inner face, 5 1/2" lookout blocking</text>
  <text x="1035" y="195" font-size="11" fill="#333" text-anchor="end">to the wall face &#8212; see R-3</text>
  <polyline points="1000,205 970,205 970,340" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="938.3" cy="340" r="3" fill="#333"/>
  <line x1="938.3" y1="340" x2="970" y2="340" stroke="#333" stroke-width="1"/>

  <!-- panel run divisions, 14 runs across the width -->
  <g stroke="#ffffff" stroke-width="2.4" opacity="0.95">
    <line x1="207.1" y1="200" x2="207.1" y2="599.6"/>
    <line x1="264.3" y1="200" x2="264.3" y2="599.6"/>
    <line x1="321.4" y1="200" x2="321.4" y2="599.6"/>
    <line x1="378.6" y1="200" x2="378.6" y2="599.6"/>
    <line x1="435.7" y1="200" x2="435.7" y2="599.6"/>
    <line x1="492.9" y1="200" x2="492.9" y2="599.6"/>
    <line x1="550.0" y1="200" x2="550.0" y2="599.6"/>
    <line x1="607.1" y1="200" x2="607.1" y2="599.6"/>
    <line x1="664.3" y1="200" x2="664.3" y2="599.6"/>
    <line x1="721.4" y1="200" x2="721.4" y2="599.6"/>
    <line x1="778.6" y1="200" x2="778.6" y2="599.6"/>
    <line x1="835.7" y1="200" x2="835.7" y2="599.6"/>
    <line x1="892.9" y1="200" x2="892.9" y2="599.6"/>
  </g>

  <!-- Legend for the two line systems -->
  <line x1="150" y1="700" x2="182" y2="700" stroke="#ffffff" stroke-width="2.4"/>
  <line x1="150" y1="700" x2="182" y2="700" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="190" y="704" font-size="11" fill="#333">panel run divisions &#8212; 14 runs</text>
  <line x1="380" y1="700" x2="412" y2="700" stroke="#000000" stroke-width="1.1" stroke-dasharray="4 4"/>
  <text x="420" y="704" font-size="11" fill="#333">rafters below &#8212; reference only</text>

  <!-- CHALK LINE -->
  <line x1="150" y1="367.1" x2="950" y2="367.1" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="965" y="371" font-size="14" font-weight="bold" fill="#1a1a1a">CHALK LINE</text>

  <!-- panel labels -->
  <text x="250" y="235" font-size="15" font-weight="bold" fill="#ffffff">UPPER PANELS</text>
  <text x="250" y="253" font-size="12" fill="#ffffff">14 required, each cut to 10'-10 1/4"</text>
  <text x="250" y="269" font-size="12" fill="#ffffff">north: 4" overhang past finished wall</text>

  <text x="250" y="520" font-size="15" font-weight="bold" fill="#ffffff">LOWER PANELS</text>
  <text x="250" y="538" font-size="12" fill="#ffffff">14 required, each 12'-0"</text>
  <text x="250" y="554" font-size="12" fill="#ffffff">south: 8" overhang past finished wall</text>

  <text x="550" y="470" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">overlap &#8212; see Detail R-1</text>

  <!-- Width dimension across the bottom -->
  <line x1="150" y1="662" x2="950" y2="662" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="150" y1="655" x2="150" y2="669" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="950" y1="655" x2="950" y2="669" stroke="#1a1a1a" stroke-width="1"/>
  <text x="550" y="685" font-size="13" fill="#333" text-anchor="middle">40'-0" building length</text>

  <!-- Depth / chalk line offset dimension on the west side, close to the roof -->
  <line x1="125" y1="200" x2="125" y2="367.1" stroke="#333" stroke-width="1"/>
  <line x1="118" y1="200" x2="132" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="118" y1="367.1" x2="132" y2="367.1" stroke="#333" stroke-width="1"/>
  <text x="110" y="288" font-size="12" font-weight="bold" fill="#333" text-anchor="end" transform="rotate(-90 110 288)">8'-4 1/4" to chalk line</text>

  <line x1="55" y1="200" x2="55" y2="599.6" stroke="#333" stroke-width="1"/>
  <line x1="48" y1="200" x2="62" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="48" y1="599.6" x2="62" y2="599.6" stroke="#333" stroke-width="1"/>
  <text x="37" y="404" font-size="12" font-weight="bold" fill="#333" text-anchor="end" transform="rotate(-90 37 404)">total rake 19'-7 1/2"</text>

  <line x1="60" y1="722" x2="1040" y2="722" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="60" y="746" font-size="15" font-weight="bold" fill="#1a1a1a">INSTALL SEQUENCE</text>
  <text x="60" y="768" font-size="13" fill="#333">1. Snap chalk line at 8'-4 1/4"</text>
  <text x="60" y="788" font-size="13" fill="#333">2. Install lower panels to the line</text>
  <text x="60" y="808" font-size="13" fill="#333">3. Install upper panels to measurements (4" overhang, lap per Detail R-1)</text>
<text x="600" y="746" font-family="Arial" font-size="16" font-weight="bold" fill="#000">PANEL LAYOUT</text>
<text x="600" y="768" font-family="Arial" font-size="11" fill="#000">(ROOF PLAN &#x2014; PHASE 1 METAL PANEL LAYOUT)</text>
<text x="600" y="788" font-family="Arial" font-size="11" fill="#000">SCALE:  NOT TO SCALE       DRAWING R-2</text>
</svg>