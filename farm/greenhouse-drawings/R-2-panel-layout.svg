  <line x1="118" y1="200" x2="132" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="118" y1="367.1" x2="132" y2="367.1" stroke="#333" stroke-width="1"/>
  <text x="110" y="288" font-size="12" font-weight="bold" fill="#333" text-anchor="end" transform="rotate(-90 110 288)">8'-4 1/4" to chalk line</text>

  <line x1="55" y1="200" x2="55" y2="599.6" stroke="#333" stroke-width="1"/>
  <line x1="48" y1="200" x2="62" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="48" y1="599.6" x2="62" y2="599.6" stroke="#333" stroke-width="1"/>
  <text x="37" y="404" font-size="12" font-weight="bold" fill="#333" text-anchor="end" transform="rotate(-90 37 404)">total rake 19'-7 1/2"</text>

  <line x1="60" y1="710" x2="1040" y2="710" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="60" y="734" font-size="15" font-weight="bold" fill="#1a1a1a">INSTALL SEQUENCE</text>
  <text x="60" y="754" font-size="13" fill="#333">1. Snap chalk line at 8'-4 1/4" — the proposed measurement  ·  2. Install lower panels to the line</text>
  <text x="60" y="772" font-size="13" fill="#333">3. Install upper panels to measurements (4" overhang, lap per Detail R-1)</text>
<text x="40" y="800" font-family="Arial" font-size="16" font-weight="bold" fill="#000">PANEL LAYOUT</text><text x="40" y="818" font-family="Arial" font-size="11" fill="#000">(ROOF PLAN &#x2014; PHASE 1 METAL PANEL LAYOUT)</text><text x="40" y="834" font-family="Arial" font-size="11" fill="#000">SCALE:  NOT TO SCALE       DRAWING R-2</text></svg>
