  <text x="250" y="538" font-size="12" fill="#ffffff">14 required, each 12'-0"</text>
  <text x="250" y="554" font-size="12" fill="#ffffff">south: 8" overhang past finished wall</text>

  <text x="550" y="470" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">overlap — see Detail R-1</text>

