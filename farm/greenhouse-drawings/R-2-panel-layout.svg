  <text x="1035" y="180" font-size="11" fill="#c2410c" text-anchor="end">roof carried past on lookouts</text>
  <polyline points="1000,190 970,190 970,340" fill="none" stroke="#c2410c" stroke-width="1"/>
  <circle cx="940" cy="340" r="3" fill="#c2410c"/>
  <line x1="940" y1="340" x2="970" y2="340" stroke="#c2410c" stroke-width="1"/>

  <!-- panel run divisions, 14 runs across the width -->
