<text x="2420.00" y="450.00" font-family="Arial" font-size="19" font-weight="bold" fill="#000" text-anchor="start">PIER - 36" BELOW GRADE</text>
<text x="2420.00" y="474.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">CAST INTEGRAL WITH THE BEAM.</text>
<text x="2420.00" y="498.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">THIS IS THE FROST CONTROL.</text>
<line x1="1941.50" y1="1150.00" x2="2350.00" y2="612.00" stroke="#000" stroke-width="0.5"/>
<line x1="2350.00" y1="612.00" x2="2410.00" y2="612.00" stroke="#000" stroke-width="0.5"/>
<text x="2420.00" y="600.00" font-family="Arial" font-size="19" font-weight="bold" fill="#000" text-anchor="start">GRADE BEAM - 6" x 12"</text>
<text x="2420.00" y="624.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">6" BELOW GRADE, 6" ABOVE.</text>
<text x="2420.00" y="648.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">FLUSH INBOARD WITH THE WALL INSIDE</text>
<text x="2420.00" y="672.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">FACE. 1/2" PROUD OUT.</text>
<line x1="1547.38" y1="1354.00" x2="2350.00" y2="792.00" stroke="#000" stroke-width="0.5"/>
<line x1="2350.00" y1="792.00" x2="2410.00" y2="792.00" stroke="#000" stroke-width="0.5"/>
<text x="2420.00" y="780.00" font-family="Arial" font-size="19" font-weight="bold" fill="#000" text-anchor="start">J-BOLT - SOUTH WALL, PER BAY</text>
<text x="2420.00" y="804.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">TWO PER BAY, 6" INSIDE EACH POST</text>
<text x="2420.00" y="828.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">FACE. ANCHORS THE SILL PLATE</text>
<text x="2420.00" y="852.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">BETWEEN POSTS.</text>
<line x1="1573.62" y1="1363.00" x2="2350.00" y2="972.00" stroke="#000" stroke-width="0.5"/>
<line x1="2350.00" y1="972.00" x2="2410.00" y2="972.00" stroke="#000" stroke-width="0.5"/>
<text x="2420.00" y="960.00" font-family="Arial" font-size="19" font-weight="bold" fill="#000" text-anchor="start">PIER UNDER EACH POST</text>
<text x="2420.00" y="984.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">5 POSTS, 6x6, STANDOFF BASES.</text>
<text x="2420.00" y="1008.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">NO PADS.</text>
<text x="30.00" y="1680.00" font-family="Arial" font-size="38" font-weight="bold" fill="#000" text-anchor="start">FOUNDATION AND CONCRETE PLAN</text>
<text x="30.00" y="1718.00" font-family="Arial" font-size="24" fill="#000" text-anchor="start">MONOLITHIC GRADE BEAM WITH INTEGRAL PIERS - PLAN LOOKING DOWN - NORTH AT TOP, WEST AT LEFT</text>
<text x="30.00" y="1752.00" font-family="Arial" font-size="24" fill="#000" text-anchor="start">SCALE:  1/2" = 1'-0"          DRAWING S-6</text>
<rect x="30.00" y="1772.00" width="1390.00" height="700.00" fill="none" stroke="#000" stroke-width="1.0"/>
<text x="52.00" y="1814.00" font-family="Arial" font-size="28" font-weight="bold" fill="#000" text-anchor="start">GENERAL NOTES</text>
<text x="52.00" y="1860.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">1. ONE MONOLITHIC POUR. BEAM AND PIERS TOGETHER.</text>
<text x="52.00" y="1894.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">2. NO FOOTING AT THE NORTH. CONTAINER CARRIES THAT EDGE.</text>
<text x="52.00" y="1928.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">3. DO NOT EXCAVATE ALONG THE CONTAINER'S SOUTH FACE. NORTH PIER HOLES HELD</text>
<text x="52.00" y="1962.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">   12" CLEAR OF IT.</text>
<text x="52.00" y="1996.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">4. PIERS REACH BELOW FROST. NO FROST SKIRT ON THIS BUILDING.</text>
<text x="52.00" y="2030.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">5. PIER UNDER EVERY POST. THE CORNER POST PIER IS ALSO THE LEG CORNER DROP.</text>
<text x="52.00" y="2064.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">6. PIER PLAN SIZE NOMINAL. THE 36" DEPTH IS THE CONTROL.</text>
<text x="52.00" y="2098.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">7. NO POST PADS. EACH POST BEARS ON THE BEAM WITH A PIER UNDER IT.</text>
<text x="52.00" y="2132.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">8. S-1 DRAWS THE POST LINE 39'-11" OUTER TO OUTER UNDER A 40'-0" CONTAINER.</text>
<text x="52.00" y="2166.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">   VERIFY THE 1" AT LAYOUT BEFORE FORMING.</text>
<text x="52.00" y="2200.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">9. #4 REBAR AS TYPICAL.</text>
<text x="52.00" y="2234.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">10. PEN SLAB AND EXTERIOR FLATWORK POURED THIS PROJECT, NOT PART OF THE</text>
<text x="52.00" y="2268.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">   STRUCTURAL POUR.</text>
<text x="52.00" y="2302.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">11. BEAM POURED TO GRADE ONLY ACROSS BOTH DOOR OPENINGS. THE SLAB COMES</text>
<text x="52.00" y="2336.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">   UP FLUSH AT 0'-6" AND FORMS THE THRESHOLD.</text>
<text x="52.00" y="2370.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">12. J-BOLT EACH SIDE OF BOTH DOOR GAPS, 6" CLEAR.</text>
<rect x="1460.00" y="1772.00" width="1390.00" height="700.00" fill="none" stroke="#000" stroke-width="1.0"/>
<text x="1482.00" y="1814.00" font-family="Arial" font-size="28" font-weight="bold" fill="#000" text-anchor="start">SCHEDULE</text>
<text x="1482.00" y="1860.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">GRADE BEAM: 6" WIDE x 12" DEEP, 6 BELOW / 6 ABOVE</text>
<text x="1482.00" y="1894.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">PIERS: 6" SQ x 36" DEEP</text>
<text x="1482.00" y="1928.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">PIERS: 4 EAST/WEST + 5 UNDER POSTS = 9</text>
<text x="1482.00" y="1962.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">PIER SPACING: 8'-5 1/2" O.C.</text>
<text x="1482.00" y="1996.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">J-BOLTS, SOUTH: 2 PER BAY, 6" INSIDE EACH POST</text>
<text x="1482.00" y="2030.00" font-family="Arial" font-size="30.0" fill="#000" text-anchor="start">POST SPACING: 9'-10 3/8" O.C. - PER S-1</text>
