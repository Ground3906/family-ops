<text x="2420.00" y="290.00" font-family="Arial" font-size="19" font-weight="bold" fill="#000" text-anchor="start">J-BOLT - 1/2" x 10"</text>
<text x="2420.00" y="314.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">EAST AND WEST LEGS ONLY.</text>
<text x="2420.00" y="338.00" font-family="Arial" font-size="17" fill="#000" text-anchor="start">6'-0" O.C. AND WITHIN 12" OF EVERY CORNER.</text>
<line x1="1932.50" y1="1049.50" x2="2350.00" y2="462.00" stroke="#000" stroke-width="0.5"/>
