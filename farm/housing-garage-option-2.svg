<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle">Garage Option 2 — Left Wall Unchanged, 2 Pig Pens Upper Right, No Sheep Pen</text>
  <text x="450" y="50" font-size="13" text-anchor="middle" fill="#555">Scale: 1 ft = 25px | Garage: 23' x 23'</text>

  <rect x="100" y="100" width="575" height="575" fill="none" stroke="black" stroke-width="3"/>

  <g stroke="#ddd" stroke-width="1">
    <line x1="225" y1="100" x2="225" y2="675"/>
    <line x1="350" y1="100" x2="350" y2="675"/>
    <line x1="475" y1="100" x2="475" y2="675"/>
    <line x1="600" y1="100" x2="600" y2="675"/>
    <line x1="100" y1="225" x2="675" y2="225"/>
    <line x1="100" y1="350" x2="675" y2="350"/>
    <line x1="100" y1="475" x2="675" y2="475"/>
    <line x1="100" y1="600" x2="675" y2="600"/>
  </g>

  <text x="90" y="90" font-size="12" text-anchor="end" fill="#900">TOP WALL</text>
  <text x="90" y="105" font-size="12" text-anchor="end" fill="#900">LEFT WALL</text>
  <text x="685" y="105" font-size="12" text-anchor="start" fill="#900">RIGHT WALL</text>

  <rect x="100" y="100" width="250" height="125" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="225" y="155" font-size="15" text-anchor="middle" font-weight="bold">PIG 1</text>
  <text x="225" y="173" font-size="12" text-anchor="middle">10' x 5'</text>

  <rect x="100" y="225" width="250" height="125" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="225" y="280" font-size="15" text-anchor="middle" font-weight="bold">PIG 2</text>
  <text x="225" y="298" font-size="12" text-anchor="middle">10' x 5'</text>

  <rect x="100" y="350" width="250" height="125" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="225" y="405" font-size="15" text-anchor="middle" font-weight="bold">PIG 3</text>
  <text x="225" y="423" font-size="12" text-anchor="middle">10' x 5'</text>

  <rect x="100" y="475" width="250" height="200" fill="#eeeeee" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="225" y="580" font-size="12" text-anchor="middle" fill="#666">open floor (8')</text>

  <rect x="350" y="100" width="75" height="575" fill="#fff7cc" stroke="black" stroke-width="2"/>
  <text x="387.5" y="390" font-size="14" text-anchor="middle" font-weight="bold" transform="rotate(-90 387.5,390)">AISLE — 3' wide</text>

  <rect x="425" y="100" width="125" height="250" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="487.5" y="215" font-size="15" text-anchor="middle" font-weight="bold">PIG 4</text>
  <text x="487.5" y="233" font-size="12" text-anchor="middle">5' x 10'</text>

  <rect x="550" y="100" width="125" height="250" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="612.5" y="215" font-size="15" text-anchor="middle" font-weight="bold">PIG 5</text>
  <text x="612.5" y="233" font-size="12" text-anchor="middle">5' x 10'</text>

  <rect x="425" y="350" width="250" height="325" fill="#eeeeee" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="550" y="515" font-size="13" text-anchor="middle" fill="#666">open floor (13')</text>

  <line x1="100" y1="75" x2="675" y2="75" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="387.5" y="68" font-size="13" text-anchor="middle">23' 0" (garage width)</text>

  <line x1="100" y1="100" x2="100" y2="70" stroke="black"/>
  <line x1="350" y1="100" x2="350" y2="70" stroke="black"/>
  <line x1="425" y1="100" x2="425" y2="70" stroke="black"/>
  <line x1="550" y1="100" x2="550" y2="70" stroke="black"/>
  <line x1="675" y1="100" x2="675" y2="70" stroke="black"/>
  <text x="225" y="90" font-size="10" text-anchor="middle">10'</text>
  <text x="387.5" y="90" font-size="10" text-anchor="middle">3'</text>
  <text x="487.5" y="90" font-size="10" text-anchor="middle">5'</text>
  <text x="612.5" y="90" font-size="10" text-anchor="middle">5'</text>

  <line x1="60" y1="100" x2="60" y2="675" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="35" y="390" font-size="13" text-anchor="middle" transform="rotate(-90 35,390)">23' 0" (garage depth)</text>

  <line x1="90" y1="100" x2="60" y2="100" stroke="black"/>
  <line x1="90" y1="350" x2="60" y2="350" stroke="black"/>
  <line x1="90" y1="475" x2="60" y2="475" stroke="black"/>
  <line x1="90" y1="675" x2="60" y2="675" stroke="black"/>
  <text x="80" y="230" font-size="10" text-anchor="end">10'</text>
  <text x="80" y="580" font-size="10" text-anchor="end">8'/13'</text>

  <text x="100" y="705" font-size="12" fill="#333">Width check: 10' (left) + 3' (aisle) + 5' + 5' (right, Pig4+Pig5) = 23' ✓</text>
  <text x="100" y="723" font-size="12" fill="#333">Depth check: left wall 15' pens + 8' open = 23' ✓  |  right side: 10' pens + 13' open = 23' ✓</text>
  <text x="100" y="741" font-size="12" fill="#333">All 5 pig pens equal: 5' x 10' = 50 sq ft each</text>
  <text x="100" y="759" font-size="12" fill="#900">No sheep pen in this version — lambs need a home elsewhere (container, or a later revision)</text>
</svg>
