<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle">Container Option 1 — Door Walkway Removed, Pig Pens Extended, Merged Pen Unchanged</text>
  <text x="500" y="50" font-size="13" text-anchor="middle" fill="#555">Scale: 1 ft = 20px | Interior: 39'6" L x 7'8" W</text>

  <rect x="90" y="120" width="790" height="153.3" fill="none" stroke="black" stroke-width="3"/>

  <g stroke="#ddd" stroke-width="1">
    <line x1="190" y1="120" x2="190" y2="273.3"/>
    <line x1="290" y1="120" x2="290" y2="273.3"/>
    <line x1="390" y1="120" x2="390" y2="273.3"/>
    <line x1="490" y1="120" x2="490" y2="273.3"/>
    <line x1="590" y1="120" x2="590" y2="273.3"/>
    <line x1="690" y1="120" x2="690" y2="273.3"/>
    <line x1="780" y1="120" x2="780" y2="273.3"/>
  </g>

  <text x="90" y="110" font-size="11" text-anchor="start" fill="#900">← DOOR END</text>
  <text x="880" y="110" font-size="11" text-anchor="end" fill="#900">BACK WALL →</text>

  <rect x="90" y="120" width="167.5" height="80" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="173.75" y="155" font-size="13" text-anchor="middle" font-weight="bold">PIG 1</text>
  <text x="173.75" y="170" font-size="10" text-anchor="middle">4' x 8'4.5"</text>

  <rect x="257.5" y="120" width="167.5" height="80" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="341.25" y="155" font-size="13" text-anchor="middle" font-weight="bold">PIG 2</text>
  <text x="341.25" y="170" font-size="10" text-anchor="middle">4' x 8'4.5"</text>

  <rect x="425" y="120" width="167.5" height="80" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="508.75" y="155" font-size="13" text-anchor="middle" font-weight="bold">PIG 3</text>
  <text x="508.75" y="170" font-size="10" text-anchor="middle">4' x 8'4.5"</text>

  <rect x="592.5" y="120" width="167.5" height="80" fill="#f5d9c8" stroke="black" stroke-width="2"/>
  <text x="676.25" y="155" font-size="13" text-anchor="middle" font-weight="bold">PIG 4</text>
  <text x="676.25" y="170" font-size="10" text-anchor="middle">4' x 8'4.5"</text>

  <rect x="90" y="200" width="670" height="73.3" fill="#fff7cc" stroke="black" stroke-width="2"/>
  <text x="425" y="240" font-size="12" text-anchor="middle" font-weight="bold">SIDE WALKWAY — 3'8" wide x 33'6" (starts at door, unchanged width)</text>

  <rect x="760" y="120" width="120" height="153.3" fill="#d9e8c8" stroke="black" stroke-width="2"/>
  <text x="820" y="190" font-size="14" text-anchor="middle" font-weight="bold">PEN 4/5</text>
  <text x="820" y="207" font-size="11" text-anchor="middle">7'8" x 6' (unchanged)</text>

  <line x1="90" y1="95" x2="880" y2="95" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="485" y="88" font-size="13" text-anchor="middle">39' 6" (interior length)</text>

  <line x1="90" y1="120" x2="90" y2="90" stroke="black"/>
  <line x1="257.5" y1="120" x2="257.5" y2="90" stroke="black"/>
  <line x1="425" y1="120" x2="425" y2="90" stroke="black"/>
  <line x1="592.5" y1="120" x2="592.5" y2="90" stroke="black"/>
  <line x1="760" y1="120" x2="760" y2="90" stroke="black"/>
  <line x1="880" y1="120" x2="880" y2="90" stroke="black"/>

  <text x="173.75" y="290" font-size="10" text-anchor="middle">8'4.5"</text>
  <text x="341.25" y="290" font-size="10" text-anchor="middle">8'4.5"</text>
  <text x="508.75" y="290" font-size="10" text-anchor="middle">8'4.5"</text>
  <text x="676.25" y="290" font-size="10" text-anchor="middle">8'4.5"</text>
  <text x="820" y="290" font-size="10" text-anchor="middle">6'</text>

  <line x1="60" y1="120" x2="60" y2="273.3" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="35" y="200" font-size="13" text-anchor="middle" transform="rotate(-90 35,200)">7' 8" (interior width, unchanged)</text>

  <text x="90" y="330" font-size="12" fill="#333">Length check: (4 x 8'4.5") + 6' = 33'6" + 6' = 39'6" ✓</text>
  <text x="90" y="348" font-size="12" fill="#333">Pig pens: 4' x 8'4.5" = ~33.4 sq ft each — all 4 equal</text>
  <text x="90" y="366" font-size="12" fill="#333">Merged Pen 4/5 unchanged: 7'8" x 6' = 46 sq ft, still its own block at the back</text>
  <text x="90" y="384" font-size="12" fill="#900">Note: door walkway removed entirely — side walkway now starts right at the door</text>
</svg>
